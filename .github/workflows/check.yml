name: Blog checks
on:
  push:
    branches: [main, codex/blog-cache-and-theme]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/cache-policy.test.ts
      - run: pnpm typecheck
      - run: pnpm build
